name: PikaOS Package Build

on:
  workflow_dispatch:
    inputs:
      leg:
        description: 'canary | cockatiel | cockatiel-testing'
        required: true
        default: cockatiel-testing
      arch:
        description: 'v3 | i386  (i386 is canary-only today — see header)'
        required: true
        default: v3
      release:
        description: 'ship the debs to the target incoming dir (true/false)'
        required: true
        default: 'false'
      target_incoming:
        description: 'incoming dir name; allowlisted, defaults per leg'
        required: false
        default: ''
      package_version:
        description: 'version being built (audit trail)'
        required: false
        default: ''
      rebuild_version:
        description: 'binNMU suffix, e.g. b1 (PLAN §8.6)'
        required: false
        default: ''
      serial:
        description: 'force parallel=1 (0/1)'
        required: false
        default: '0'
      tools_ref:
        description: 'ref of repo-tools/workflows for lib/package-build.sh'
        required: false
        default: 'v1'

concurrency:
  group: nb-build-${{ github.repository }}-${{ inputs.leg }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: git.pika-os.com/repo-tools/docker-images/pika-builder:${{ inputs.leg }}${{ inputs.arch == 'i386' && '-i386' || '' }}
      volumes:
        - /proc:/proc
      options: --privileged -it
    steps:
      - uses: actions/checkout@v3

      - name: Fetch central build logic
        uses: actions/checkout@v3
        with:
          repository: repo-tools/workflows
          ref: ${{ inputs.tools_ref }}
          path: .nb

      - name: Install SSH key
        if: inputs.release == 'true'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Update APT cache
        run: apt-get update -y

      - name: Build
        env:
          NB_LEG: ${{ inputs.leg }}
          NB_ARCH: ${{ inputs.arch }}
          NB_RELEASE: ${{ inputs.release }}
          NB_TOOLS: .nb
          NB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NB_IN_PIKA_TARGET_INCOMING: ${{ inputs.target_incoming }}
          NB_IN_PIKA_PACKAGE_VERSION: ${{ inputs.package_version }}
          NB_IN_PIKA_REBUILD_VERSION: ${{ inputs.rebuild_version }}
          NB_IN_PIKA_SERIAL: ${{ inputs.serial }}
        run: bash .nb/lib/package-build.sh

      - name: Upload build output
        if: success() && inputs.release != 'true'
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          retention-days: 7
          path: |
            output/
            nb-build.log
          if-no-files-found: warn

      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: failure-report
          path: |
            failure.json
            nb-build.log
          if-no-files-found: ignore
